spring.application.name=driveaway
spring.data.mongodb.uri=${MONGO_URI}
# Ensure @Indexed(unique=true) annotations are applied as DB-level constraints on startup
spring.data.mongodb.auto-index-creation=true

# ── Email / SMTP configuration ──────────────────────────────────────────────
# Defaults to Gmail SMTP using the DriveAway rental-vehicle sender mailbox.
# To enable real email delivery set MAIL_PASSWORD to the Gmail App Password
# (generate one at https://myaccount.google.com/apppasswords).
# Override individual settings with matching environment variables as needed.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:rentalvehicle.driveaway@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:rentalvehicle.driveaway@gmail.com}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Base URL used to build email verification links
app.base-url=${APP_BASE_URL:http://localhost:8080}