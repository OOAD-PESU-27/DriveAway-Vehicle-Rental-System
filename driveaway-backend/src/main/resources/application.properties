spring.application.name=driveaway
spring.data.mongodb.uri=${MONGO_URI}

# ── Email / SMTP configuration ──────────────────────────────────────────────
# Set MAIL_HOST to enable real SMTP; leave unset to use simulated (log-only) mode.
# Example for Gmail: MAIL_HOST=smtp.gmail.com MAIL_PORT=587
#                    MAIL_USERNAME=you@gmail.com MAIL_PASSWORD=<app-password>
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:noreply@driveaway.com}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Base URL used to build email verification links
app.base-url=${APP_BASE_URL:http://localhost:8080}